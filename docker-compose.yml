services:
  postgres:
    image: postgres:16
    container_name: djpp-postgres
    environment:
      POSTGRES_DB: djpp
      POSTGRES_USER: djpp
      POSTGRES_PASSWORD: djpp
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: djpp-redis
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: djpp-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: djpp-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

  job-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: job-api
    image: djpp-job-api:local
    container_name: djpp-job-api
    depends_on:
      - postgres
      - kafka
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/djpp
      DB_USERNAME: djpp
      DB_PASSWORD: djpp
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8080:8080"
    restart: unless-stopped

  job-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: job-worker
    image: djpp-job-worker:local
    depends_on:
      - postgres
      - kafka
      - redis
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/djpp
      DB_USERNAME: djpp
      DB_PASSWORD: djpp
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
    ports:
      - "8081"
    restart: unless-stopped

volumes:
  postgres_data:
