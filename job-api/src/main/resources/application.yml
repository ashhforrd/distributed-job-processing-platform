spring:
  application:
    name: job-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/djpp}
    username: ${DB_USERNAME:djpp}
    password: ${DB_PASSWORD:djpp}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

app:
  kafka:
    job-topic: ${JOB_TOPIC:jobs.v1}